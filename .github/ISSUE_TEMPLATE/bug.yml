name: Bug
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: What did you see vs what you expected?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Slack DM
        - Slack channel / thread
        - Install / systemd
        - Cursor agent spawn
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Node, bridge git SHA, Cursor agent CLI version
  - type: textarea
    id: logs
    attributes:
      label: Logs (redact tokens)
      description: journalctl snippet or console output. Strip xoxb-/xapp-/API keys.
