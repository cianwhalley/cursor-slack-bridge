name: Feature
description: Propose a change to the bridge
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Keep the bridge a transport. Hub/skills changes belong in agent-hub-template.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - Slack UX
        - Policy / allowlist
        - Agent CLI integration
        - Install / ops
        - Docs
    validations:
      required: true
